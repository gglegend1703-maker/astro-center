<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Астрономический центр</title>
  <style>
    /* Базовые стили для красивого вида */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #e2e8f0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: rgba(30, 41, 59, 0.8);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    h1 { text-align: center; margin-top: 0; font-size: 24px; color: #a78bfa; }
    .tabs { display: flex; margin-bottom: 20px; }
    .tab {
      flex: 1; padding: 10px; text-align: center; cursor: pointer;
      border-bottom: 2px solid transparent; color: #94a3b8; font-weight: bold;
    }
    .tab.active { border-bottom: 2px solid #a78bfa; color: #a78bfa; }
    .form-group { margin-bottom: 15px; }
    input {
      width: 100%; padding: 12px; box-sizing: border-box; border-radius: 6px;
      border: 1px solid #475569; background: #0f172a; color: #fff; outline: none;
    }
    input:focus { border-color: #a78bfa; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 6px;
      background: #8b5cf6; color: white; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #7c3aed; }
    .hidden { display: none; }
    .status { text-align: center; margin-top: 20px; color: #4ade80; font-weight: bold; }
    .error { color: #f87171; font-size: 14px; margin-top: 10px; text-align: center; }
    .logout-btn { background: #ef4444; margin-top: 10px; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Астрономический центр</h1>

    <!-- Блок, который видят НЕавторизованные пользователи -->
    <div id="auth-block">
      <div class="tabs">
        <div class="tab active" id="tab-login" onclick="switchTab('login')">Вход</div>
        <div class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</div>
      </div>

      <form id="auth-form">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" required>
        </div>
        <button type="submit" id="submit-btn">Войти</button>
      </form>
      <div id="auth-error" class="error"></div>
    </div>

    <!-- Блок, который видят АВТОРИЗОВАННЫЕ пользователи -->
    <div id="user-block" class="hidden">
      <p class="status" id="auth-status">Вы вошли!</p>
      <p style="text-align: center; color: #94a3b8;" id="user-email"></p>
      <button id="logout-btn" class="logout-btn">Выйти</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
